<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kit</title>
<style>
  :root {
    --bg: #0a0c10;
    --bg-elev: #161a23;
    --fg: #f0f4fa;          /* brighter — was #d7dde6 */
    --fg-dim: #b0b8c5;      /* brighter — was #7d8694 */
    --fg-faint: #6c7484;    /* brighter — was #4a5260 */
    --rule: #232a36;
    --rule-bright: #38415247;
    --accent: #9ec5ff;      /* brighter blue */
    --accent-strong: #c1d6ff;
    --green: #6ee0a8;       /* brighter */
    --amber: #ffc977;
    --red: #ff8888;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --fs-base: 16px;        /* was 14 */
    --fs-small: 13px;
    --fs-tiny: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: var(--fs-base)/1.5 var(--mono);
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ::selection { background: var(--accent); color: var(--bg); }

  /* --- header --- */
  header {
    border-bottom: 1px solid var(--rule);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  header .brand {
    font-size: 16px;
    letter-spacing: 0.01em;
    color: var(--fg);
    font-weight: 400;
  }
  header .brand .ctx {
    color: var(--fg-dim);
    /* user@host : ~  rendered like a real shell prompt */
  }
  header .brand .prompt {
    color: var(--accent);
    font-weight: 600;
  }
  header .brand .cmd {
    color: var(--fg);
    font-weight: 700;
  }

  /* system stats bar — lives in the header on the right */
  .sysbar {
    margin-left: auto;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .sysbar .stat {
    color: var(--fg-dim);
    font-size: var(--fs-small);
    white-space: nowrap;
  }
  .sysbar .stat .label {
    color: var(--fg-faint);
    margin-right: 6px;
  }
  .sysbar .stat .val { color: var(--fg); font-weight: 600; }
  .sysbar .stat.green .val { color: var(--green); }
  .sysbar .stat.amber .val { color: var(--amber); }
  .sysbar .stat.red   .val { color: var(--red); }

  /* --- tabs --- */
  nav.tabs {
    display: flex;
    gap: 0;
    padding: 0 24px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
    overflow-x: auto;
  }
  nav.tabs a {
    padding: 14px 20px;        /* was 12 16 */
    color: var(--fg-dim);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
    font-size: 15px;            /* was 13 */
    text-decoration: none;
    font-weight: 500;
  }
  nav.tabs a:hover { color: var(--fg); text-decoration: none; }
  nav.tabs a.active {
    color: var(--accent-strong);
    border-bottom-color: var(--accent);
  }
  nav.tabs a .key {
    color: var(--fg-faint);
    font-size: var(--fs-tiny);
    margin-right: 8px;
    font-weight: 400;
  }
  nav.tabs a.active .key { color: var(--accent); }

  /* --- layout --- */
  main {
    padding: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* --- shared bits --- */
  .row-title {
    color: var(--fg-dim);
    text-transform: uppercase;
    font-size: var(--fs-small);    /* was 11 */
    letter-spacing: 0.1em;
    margin: 28px 0 12px;
    font-weight: 600;
  }
  .row-title:first-child { margin-top: 0; }

  .card {
    display: block;
    padding: 16px 20px;            /* was 14 16 */
    margin-bottom: 10px;
    background: var(--bg-elev);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--rule-bright);
    border-radius: 5px;
    color: inherit;
    transition: border-color .12s, background .12s;
  }
  .card:hover {
    border-color: var(--accent);
    border-left-color: var(--accent);
    text-decoration: none;
  }
  .card .row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card .name { color: var(--fg); font-weight: 600; font-size: 16px; } /* was 14, 500 */
  .card .desc { color: var(--fg-dim); font-size: var(--fs-small); margin-top: 6px; }
  .card .meta { color: var(--fg-dim); font-size: var(--fs-small); flex-shrink: 0; }
  .icon { display: inline-block; width: 20px; text-align: center; margin-right: 8px; font-size: 16px; }

  /* status dot */
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    background: var(--fg-faint);
    vertical-align: middle;
  }
  .dot.green { background: var(--green); box-shadow: 0 0 6px rgba(93,211,158,0.45); }
  .dot.amber { background: var(--amber); }
  .dot.red   { background: var(--red); }

  /* status pill */
  .pill {
    font-size: 12px;             /* was 11 */
    padding: 2px 9px;
    border-radius: 10px;
    border: 1px solid var(--rule-bright);
    color: var(--fg-dim);
    font-weight: 500;
  }
  .pill.green { color: var(--green); border-color: var(--green); }

  /* form / input */
  .controls {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    margin-bottom: 4px;
  }
  .controls input {
    flex: 1;
    padding: 9px 12px;
    background: var(--bg-elev);
    border: 1px solid var(--rule-bright);
    border-radius: 4px;
    color: var(--fg);
    font: inherit;
  }
  .controls input::placeholder { color: var(--fg-faint); }
  .controls input:focus { outline: none; border-color: var(--accent); }
  .controls button {
    padding: 9px 16px;
    border-radius: 4px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    font: inherit;
  }
  .controls button:hover { background: var(--accent); color: var(--bg); }

  /* empty state */
  .empty {
    border: 1px dashed var(--rule-bright);
    border-radius: 4px;
    padding: 32px 24px;
    color: var(--fg-faint);
    text-align: center;
    font-size: 13px;
  }
  .empty code {
    background: var(--bg-elev);
    padding: 1px 6px;
    border-radius: 3px;
    color: var(--fg-dim);
  }
  .empty .hint { margin-top: 12px; font-size: 12px; }

  /* error banner */
  .err {
    padding: 10px 14px;
    background: #3a1c1c;
    border: 1px solid #6b2c2c;
    border-radius: 4px;
    color: #f5b5b5;
    margin-bottom: 16px;
    font-size: 12px;
  }

  /* footer */
  footer {
    border-top: 1px solid var(--rule);
    padding: 14px 24px;
    color: var(--fg-dim);             /* brighter — was faint */
    font-size: var(--fs-tiny);
    text-align: center;
  }
  footer code {
    color: var(--accent);
    background: var(--bg-elev);
    padding: 1px 5px;
    border-radius: 3px;
  }
</style>
</head>
<body>

<header>
  <div class="brand" id="brand">
    <span class="ctx" id="brand-ctx">user@host:~</span><span class="prompt"> $ </span><span class="cmd">kit</span>
  </div>
  <div class="sysbar" id="sysbar">
    <span class="stat" id="sys-cpu"><span class="label">cpu</span><span class="val">—</span></span>
    <span class="stat" id="sys-ram"><span class="label">mem</span><span class="val">—</span></span>
    <span class="stat" id="sys-disk"><span class="label">disk</span><span class="val">—</span></span>
    <span class="stat" id="sys-load"><span class="label">load</span><span class="val">—</span></span>
    <span class="stat" id="sys-up"><span class="label">up</span><span class="val">—</span></span>
    <span class="stat"><span class="label">srv</span><span class="val" id="meta-line">—</span></span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <a href="#webterm"  data-tab="webterm"><span class="key">1</span>webterm</a>
  <a href="#services" data-tab="services"><span class="key">2</span>services</a>
  <a href="#storage"  data-tab="storage"><span class="key">3</span>storage</a>
  <a href="#media"    data-tab="media"><span class="key">4</span>media</a>
</nav>

<main>
  <div id="error" class="err" hidden></div>

  <!-- ========== webterm ========== -->
  <section id="tab-webterm" class="tab-content">
    <div class="row-title">Claude playbooks</div>
    <div id="playbooks-list"></div>

    <div class="row-title">tmux sessions</div>
    <div id="sessions-list"></div>
    <form class="controls" onsubmit="return openSession(event)">
      <input id="new-name" placeholder="open or create session by name" autocomplete="off">
      <button type="submit">open</button>
    </form>
  </section>

  <!-- ========== services ========== -->
  <section id="tab-services" class="tab-content">
    <div id="services-list"></div>
  </section>

  <!-- ========== storage ========== -->
  <section id="tab-storage" class="tab-content">
    <div id="storage-list"></div>
  </section>

  <!-- ========== media ========== -->
  <section id="tab-media" class="tab-content">
    <div id="media-list"></div>
  </section>
</main>

<footer>
  press <code>1</code>–<code>4</code> to switch tabs · auto-refreshes when tab regains focus
</footer>

<script>
  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function humanAgo(unixSec) {
    if (!unixSec) return '';
    const d = Date.now() / 1000 - unixSec;
    if (d < 60)    return 'just now';
    if (d < 3600)  return Math.floor(d / 60)    + 'm ago';
    if (d < 86400) return Math.floor(d / 3600)  + 'h ago';
    return Math.floor(d / 86400) + 'd ago';
  }

  // ---------- tabs ----------
  const TABS = ['webterm', 'services', 'storage', 'media'];

  function setActiveTab(name) {
    if (!TABS.includes(name)) name = 'webterm';
    document.querySelectorAll('nav.tabs a').forEach(a => {
      a.classList.toggle('active', a.dataset.tab === name);
    });
    document.querySelectorAll('.tab-content').forEach(s => {
      s.classList.toggle('active', s.id === 'tab-' + name);
    });
    if (window.location.hash !== '#' + name) {
      history.replaceState(null, '', '#' + name);
    }
  }

  document.querySelectorAll('nav.tabs a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      setActiveTab(a.dataset.tab);
    });
  });
  window.addEventListener('hashchange', () => {
    setActiveTab(window.location.hash.replace('#', ''));
  });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= TABS.length) setActiveTab(TABS[n - 1]);
  });

  // ---------- renderers ----------
  function renderPlaybooks(playbooks) {
    const el = $('playbooks-list');
    if (!playbooks.length) {
      el.innerHTML = '<div class="empty">no Claude playbooks discovered<div class="hint">add one under <code>~/.claude-playbooks/&lt;name&gt;/CLAUDE.md</code> and re-run <code>./install.sh</code></div></div>';
      return;
    }
    el.innerHTML = playbooks.map(p => {
      const dotClass = p.running ? 'green' : '';
      const pill = p.running ? '<span class="pill green">running</span>' : '<span class="pill">idle</span>';
      const ago = humanAgo(p.lastActive);
      return `<a class="card" href="${esc(p.url)}">
        <div class="row1">
          <span><span class="dot ${dotClass}"></span><span class="name">${esc(p.name)}</span></span>
          <span class="meta">${pill}${ago ? ' · ' + esc(ago) : ''}</span>
        </div>
      </a>`;
    }).join('');
  }

  function renderSessions(sessions) {
    const el = $('sessions-list');
    if (!sessions.length) {
      el.innerHTML = '<div class="empty">no tmux sessions running<div class="hint">type a name below to create one</div></div>';
      return;
    }
    el.innerHTML = sessions.map(s => {
      // Bypass /tmux/<name>/ (Caddy regex can't capture across slashes) and
      // hand the raw, encoded name straight to the chooser.
      const url = '/chooser/?arg=' + encodeURIComponent(s.name);
      const dotClass = s.attached > 0 ? 'green' : '';
      const pill = s.attached > 0
        ? `<span class="pill green">attached×${s.attached}</span>`
        : '<span class="pill">idle</span>';
      const wins = s.windows + ' window' + (s.windows === 1 ? '' : 's');
      const cmds = (s.panes || []).map(p => p.command).filter(Boolean).slice(0, 3).join(', ');
      return `<a class="card" href="${esc(url)}">
        <div class="row1">
          <span><span class="dot ${dotClass}"></span><span class="name">${esc(s.name)}</span></span>
          <span class="meta">${pill} · ${esc(wins)}</span>
        </div>
        ${cmds ? `<div class="desc">${esc(cmds)}</div>` : ''}
      </a>`;
    }).join('');
  }

  function renderServiceTab(category, services) {
    const idMap = { services: 'services-list', storage: 'storage-list', media: 'media-list' };
    const el = $(idMap[category]);
    if (!el) return;
    const filtered = services.filter(s => (s.category || 'services') === category);
    if (!filtered.length) {
      el.innerHTML = `<div class="empty">no <code>${category}</code> services configured<div class="hint">add one to <code>~/.webterm-kit/services.json</code> and re-run <code>./install.sh</code></div></div>`;
      return;
    }
    el.innerHTML = filtered.map(s => {
      const url = s.url || '#';
      const icon = s.icon ? `<span class="icon">${esc(s.icon)}</span>` : '';
      const desc = s.description ? `<div class="desc">${esc(s.description)}</div>` : '';
      const proxy = s.proxy_to ? `<span class="meta">${esc(s.proxy_to)}</span>` : '';
      return `<a class="card" href="${esc(url)}">
        <div class="row1">
          <span>${icon}<span class="name">${esc(s.name)}</span></span>
          ${proxy}
        </div>
        ${desc}
      </a>`;
    }).join('');
  }

  // ---------- data load ----------
  async function load() {
    const errEl = $('error');
    try {
      const [sessRes, svcRes] = await Promise.all([
        fetch('/api/sessions'),
        fetch('/api/services'),
      ]);
      if (!sessRes.ok) throw new Error('sessions: HTTP ' + sessRes.status);
      if (!svcRes.ok)  throw new Error('services: HTTP ' + svcRes.status);
      const sess = await sessRes.json();
      const svc  = await svcRes.json();
      renderPlaybooks(sess.playbooks || []);
      renderSessions(sess.sessions || []);
      const services = svc.services || [];
      renderServiceTab('services', services);
      renderServiceTab('storage',  services);
      renderServiceTab('media',    services);
      errEl.hidden = true;
      // compact tally: 4s/2p/3v (sessions/playbooks/services)
      $('meta-line').textContent =
        `${(sess.sessions || []).length}s/${(sess.playbooks || []).length}p/${services.length}v`;
    } catch (e) {
      errEl.textContent = 'load failed: ' + e.message;
      errEl.hidden = false;
    }
  }

  function openSession(e) {
    e.preventDefault();
    const name = $('new-name').value.trim();
    if (!name) return false;
    window.location.href = '/chooser/?arg=' + encodeURIComponent(name);
    return false;
  }

  // ---------- system stats ----------
  function fmtUptime(sec) {
    if (!sec) return '—';
    const d = Math.floor(sec / 86400);
    const h = Math.floor((sec % 86400) / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (d > 0) return `${d}d ${h}h`;
    if (h > 0) return `${h}h ${m}m`;
    return `${m}m`;
  }

  function levelClass(value, amber, red) {
    if (value >= red)   return 'red';
    if (value >= amber) return 'amber';
    return 'green';
  }

  function setStat(id, valueText, level) {
    const el = $(id);
    el.querySelector('.val').textContent = valueText;
    el.classList.remove('green', 'amber', 'red');
    if (level) el.classList.add(level);
  }

  async function loadSystem() {
    try {
      const r = await fetch('/api/system');
      if (!r.ok) return;
      const s = await r.json();
      setStat('sys-cpu', `${s.cpuPct.toFixed(0)}%`,
              levelClass(s.cpuPct, 60, 85));
      const memPct = s.ramTotalGB > 0 ? (s.ramUsedGB / s.ramTotalGB * 100) : 0;
      setStat('sys-ram', `${s.ramUsedGB.toFixed(1)}/${s.ramTotalGB.toFixed(0)}G`,
              levelClass(memPct, 70, 90));
      const diskPct = s.diskTotalGB > 0 ? ((s.diskTotalGB - s.diskFreeGB) / s.diskTotalGB * 100) : 0;
      setStat('sys-disk', `${s.diskFreeGB.toFixed(0)}G free`,
              levelClass(diskPct, 75, 90));
      // Load is normalized against rough thresholds — anything > 4 starts to feel hot.
      setStat('sys-load', s.load1.toFixed(2),
              levelClass(s.load1, 4, 8));
      setStat('sys-up', fmtUptime(s.uptimeSec));
      // Build the shell-prompt-style brand: "user@host:~"
      // Fall back to whatever piece is available so the brand never goes empty.
      const user = s.user || '';
      const host = s.host || (window.location.hostname || '').split('.')[0];
      const cwd  = '~';   // dashboard isn't really IN a directory; ~ is the most prompt-like placeholder
      const ctx  = (user && host) ? `${user}@${host}:${cwd}`
                  : host           ? `${host}:${cwd}`
                  : 'kit';
      $('brand-ctx').textContent = ctx;
    } catch (e) {}
  }

  // ---------- boot ----------
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { load(); loadSystem(); }
  });
  setActiveTab(window.location.hash.replace('#', '') || 'webterm');
  load();
  loadSystem();
  setInterval(loadSystem, 5000);   // refresh stats every 5s
  setInterval(load, 30000);        // refresh sessions every 30s
</script>
</body>
</html>
